  <script>
    // Test connectFirebase with ONLY dataRef.once('value') or WITHOUT dataRef.on('value')
    window.addEventListener('DOMContentLoaded', () => {
      NetHisabApp.prototype.connectFirebase = function(config) {
        console.log("CF: Starting custom connectFirebase...");
        const cleanDbUrl = (config.databaseURL || '').trim().replace(/\/$/, '');
        const fbConfig = { databaseURL: cleanDbUrl };
        const appInstance = firebase.initializeApp(fbConfig, 'nethisab_sync_app_step');
        this.firebaseDb = appInstance.database();
        this.isCloudSyncActive = true;
        this.updateCloudStatusUI('connected', 'Live Cloud Sync 🟢');
        console.log("CF: Initialized DB. Ready!");
      };
    }, true);
  </script>
  
  <script src="app.js"></script>
